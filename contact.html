<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Owner - Campus Book Exchange</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Contact Owner</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="post-book.html">Post a Book</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Human-Computer Interaction</h2>

            <p>Seller: Student Seller</p>
            <p>Price: $30</p>
            <p>Condition: Like New</p>

            <form>
                <label for="message">Message:</label>
                <br>
                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Type your message to the seller"></textarea>

                <br><br>

                <button type="submit">Send Message</button>
            </form>

            <p>
                <a href="book-details.html">Back to Book Details</a>
            </p>

        </section>

    </main>

    <footer>
        <p>Campus Book Exchange</p>
    </footer>

</body>
</html>
