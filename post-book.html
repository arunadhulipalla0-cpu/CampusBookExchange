<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Book - Campus Book Exchange</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Post a Book</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="post-book.html">Post a Book</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>List Your Textbook</h2>

            <form>

                <div>
                    <label for="book-title">Book Title:</label>
                    <br>
                    <input type="text" id="book-title" name="book-title">
                </div>

                <br>

                <div>
                    <label for="course">Course:</label>
                    <br>
                    <input type="text" id="course" name="course">
                </div>

                <br>

                <div>
                    <label for="price">Price:</label>
                    <br>
                    <input type="number" id="price" name="price">
                </div>

                <br>

                <div>
                    <label for="condition">Condition:</label>
                    <br>

                    <select id="condition" name="condition">
                        <option value="">Select condition</option>
                        <option value="new">New</option>
                        <option value="like-new">Like New</option>
                        <option value="good">Good</option>
                        <option value="fair">Fair</option>
                        <option value="used">Used</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="book-photo">Book Photo:</label>
                    <br>
                    <input type="file" id="book-photo" name="book-photo">
                </div>

                <br>

                <button type="submit">Post Book</button>

            </form>

            <p>
                <a href="index.html">Back to Home</a>
            </p>

        </section>

    </main>

    <footer>
        <p>Campus Book Exchange</p>
    </footer>

</body>
</html>
