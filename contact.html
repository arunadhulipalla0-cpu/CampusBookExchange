<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Owner - Campus Book Exchange</title>
</head>

<body>

    <header>
        <h1 id="contact-heading">Contact Owner</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="post-book.html">Post a Book</a>
        </nav>
    </header>

    <main>

        <section>
            <h2 id="contact-book-title">Human-Computer Interaction</h2>

            <p>Seller: <span id="contact-seller">Student Seller</span></p>
            <p>Price: $<span id="contact-price">30</span></p>
            <p>Condition: <span id="contact-condition">Like New</span></p>

            <form id="contact-form">
                <label for="message">Message:</label>
                <br>

                <textarea id="message" name="message" rows="6" cols="40"
                    placeholder="Type your message to the seller"></textarea>

                <br><br>

                <button type="submit" id="contact-submit">Send Message</button>
            </form>

            <p id="contact-status"></p>

            <p>
                <a id="back-details-link" href="book-details.html">Back to Book Details</a>
            </p>

        </section>

    </main>

    <footer>
        <p>Campus Book Exchange</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
